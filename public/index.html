<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perp_Machine — 계기판</title>
  <style>
    :root {
      --ink: #1c1915; --paper: #f4efe4; --card: #fffdf7; --line: #d7cfc0;
      --muted: #6b6458; --cred: #1f4d3a; --debt: #7a2e1b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body { font: 16px/1.5 "Iowan Old Style", Palatino, "Noto Serif KR", serif; }
    header, .wrap { max-width: 74rem; margin: 0 auto; padding: 0 1rem; }
    header { padding-top: 1.2rem; }
    header h1 { font-size: 1.4rem; margin: 0; }
    header p { margin: .35rem 0 0; color: var(--muted); font-size: .92rem; }
    .note { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: .75rem; margin: 1rem 0 .6rem; }
    .market { display: flex; flex-wrap: wrap; gap: .45rem 1rem; font-variant-numeric: tabular-nums; font-size: .88rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16.2rem, 1fr)); gap: .8rem; }
    article.card { background: var(--card); border: 1px solid var(--line); padding: .85rem .9rem 1rem; display: flex; flex-direction: column; gap: .4rem; }
    article.card.buffer { background: #f7f3ea; }
    article.card:hover, article.card:focus-within { border-color: var(--ink); }
    .card h2 { font-size: 1.02rem; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
    .iso { font-size: .72rem; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
    .hero { font-variant-numeric: tabular-nums; font-size: 1.9rem; line-height: 1.1; }
    .hero small { display: block; font-size: .7rem; color: var(--muted); margin-top: .15rem; }
    .spark { width: 100%; height: 28px; display: block; }
    .base { height: 8px; background: #ece6d8; position: relative; margin: .15rem 0 .35rem; }
    .base i, .base b { position: absolute; top: -2px; width: 2px; height: 12px; background: var(--ink); }
    .base b { background: #8a7a4b; width: 3px; }
    .rows { display: grid; gap: .18rem; font-size: .78rem; font-variant-numeric: tabular-nums; }
    .rows div { display: flex; justify-content: space-between; gap: .7rem; color: var(--muted); }
    .rows span:last-child { color: var(--ink); }
    .dual { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; }
    .dual p { margin: 0; font-size: .74rem; padding: .38rem .42rem; border: 1px solid var(--line); min-height: 4.2rem; }
    .dual strong { display: block; font-size: .66rem; letter-spacing: .04em; }
    .c strong { color: var(--cred); } .d strong { color: var(--debt); }
    .ask { align-self: start; background: transparent; border: 1px solid var(--ink); font: inherit; font-size: .78rem; padding: .28rem .55rem; cursor: pointer; }
    .ask:focus { outline: 2px solid var(--ink); outline-offset: 2px; }
    .chat { margin: 1.6rem 0 2.5rem; border-top: 1px solid var(--line); padding-top: 1rem; }
    label { display: block; font-size: .85rem; margin-bottom: .3rem; }
    textarea { width: 100%; min-height: 5.2rem; padding: .65rem; border: 1px solid var(--line); background: var(--card); font: inherit; }
    textarea:focus { outline: 2px solid var(--ink); }
    .row { display: flex; gap: .5rem; align-items: center; margin-top: .5rem; flex-wrap: wrap; }
    #go { background: var(--ink); color: var(--paper); border: 0; font: inherit; padding: .42rem .85rem; cursor: pointer; }
    #go:disabled { opacity: .45; }
    #cancel { background: transparent; border: 1px solid var(--line); font: inherit; padding: .42rem .7rem; }
    #out { margin-top: .8rem; white-space: pre-wrap; border: 1px solid var(--line); padding: .75rem; background: var(--card); }
    #out:empty { display: none; }
    .badge { font-size: .72rem; color: var(--muted); }
    .err { color: var(--debt); }
    @media (max-width: 520px) { .dual { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Perp_Machine</h1>
    <p>같은 실질금리가 채권자에겐 매력, 채무자에겐 비용이다. 포지션을 묻지 않는다.</p>
  </header>
  <div class="wrap">
    <p class="note" id="vintage">계기판을 불러오는 중…</p>
    <div class="market" id="market" hidden></div>
    <div class="grid" id="grid" role="list"></div>
    <section class="chat" aria-labelledby="ask-title">
      <h2 id="ask-title" style="font-size:1.05rem;margin:0 0 .35rem;">질문 (선택)</h2>
      <label for="input">나라 이름이나 지표. 근거는 위 숫자와 달리오 지시.</label>
      <textarea id="input" placeholder="예: 한국 실질금리 / 일본은 채무자에게 싼가"></textarea>
      <div class="row">
        <button type="button" id="go">보내기</button>
        <button type="button" id="cancel" hidden>취소</button>
        <span class="badge">AI가 생성한 결과일 수 있다. 매매 아님.</span>
      </div>
      <div id="out" role="status" aria-live="polite"></div>
    </section>
  </div>
  <script>
    const $grid = document.getElementById('grid');
    const $vintage = document.getElementById('vintage');
    const $market = document.getElementById('market');
    const $in = document.getElementById('input');
    const $go = document.getElementById('go');
    const $cancel = document.getElementById('cancel');
    const $out = document.getElementById('out');
    let ctl = null, benches = {};

    const fmt = (v, unit) => {
      if (v == null) return '—';
      if (unit === 'USD') {
        const t = v / 1e9;
        return t >= 1000 ? (t/1000).toFixed(1) + '조$' : t.toFixed(0) + '십억$';
      }
      return Number(v).toFixed(2) + (unit === '%GDP' ? '%GDP' : '%');
    };
    const spark = (vals) => {
      if (!vals || vals.length < 2) return '';
      const w = 220, h = 28, p = 2;
      const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
      const pts = vals.map((v, i) => {
        const x = p + (i / (vals.length - 1)) * (w - p * 2);
        const y = h - p - ((v - min) / span) * (h - p * 2);
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
      return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><polyline fill="none" stroke="#1c1915" stroke-width="1.2" points="' + pts + '"/></svg>';
    };
    const bar = (value, key) => {
      const b = benches[key] || {};
      const vals = [value, b.peer_median, b.buffer_median].filter(v => v != null);
      if (!vals.length || value == null) return '';
      const min = Math.min(...vals) - 1, max = Math.max(...vals) + 1, span = max - min || 1;
      const pct = (x) => ((x - min) / span * 100).toFixed(1) + '%';
      let html = '<div class="base" title="검정=이 나라, 갈색=동료 중앙값">';
      html += '<i style="left:' + pct(value) + '"></i>';
      if (b.peer_median != null) html += '<b style="left:' + pct(b.peer_median) + '"></b>';
      return html + '</div>';
    };
    const cardHtml = (c) => {
      const m = c.metrics, rr = m.real_rate;
      const extras = ['policy_rate','inflation','gdp_growth','productivity','gov_debt'].map((k) => {
        const x = m[k];
        const d = x.vs_peer;
        const mark = d == null ? '' : (d >= 0 ? ' +' : ' ') + d.toFixed(1);
        return '<div><span>' + x.label + ' · ' + (x.year || '?') + '</span><span>' + fmt(x.value, x.unit) + mark + '</span></div>';
      }).join('');
      const role = c.role === 'buffer' ? '완충' : '';
      return '<article class="card ' + (c.role || '') + '" role="listitem">' +
        '<h2>' + c.name + (role ? ' · ' + role : '') + '<span class="iso">' + c.id + '</span></h2>' +
        '<div class="hero">' + fmt(rr.value, '%') +
        '<small>실질금리 · ' + (rr.year || '연도 없음') + ' · 동료중앙값 ' +
        (benches.real_rate && benches.real_rate.peer_median != null ? benches.real_rate.peer_median.toFixed(2) + '%' : '—') +
        '</small></div>' +
        spark(rr.spark) + bar(rr.value, 'real_rate') +
        '<div class="rows">' + extras + '</div>' +
        '<div class="dual"><p class="c"><strong>채권자</strong>' + c.sides.creditor +
        '</p><p class="d"><strong>채무자</strong>' + c.sides.debtor + '</p></div>' +
        '<button type="button" class="ask" data-q="' + c.name + ' 실질금리">이 나라로 묻기</button></article>';
    };

    const load = async () => {
      try {
        const res = await fetch('/api/board', { signal: AbortSignal.timeout(35000) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.status);
        benches = data.benchmarks || {};
        $vintage.textContent = (data.vintage_note || '') + ' ' + (data.benchmark_note || '');
        const mk = data.market || {};
        const bits = [];
        if (mk.us_10y) bits.push('<span>미국 10년 <b>' + mk.us_10y.price.toFixed(2) + '%</b></span>');
        if (mk.us_3m) bits.push('<span>미국 3개월 <b>' + mk.us_3m.price.toFixed(2) + '%</b></span>');
        if (mk.us_curve) bits.push('<span>' + mk.us_curve.label + ' <b>' + mk.us_curve.value + '</b></span>');
        if (bits.length) { $market.hidden = false; $market.innerHTML = bits.join('') + '<span class="badge">' + (mk.source || '') + '</span>'; }
        $grid.innerHTML = (data.cards || []).map(cardHtml).join('');
      } catch (err) {
        $vintage.innerHTML = '<span class="err">계기판 실패: ' + err.message + '</span>';
      }
    };

    $grid.addEventListener('click', (e) => {
      const btn = e.target.closest('.ask');
      if (!btn) return;
      $in.value = btn.dataset.q;
      $in.focus();
    });
    $go.addEventListener('click', async () => {
      const text = $in.value.trim();
      if (!text) return;
      ctl = new AbortController();
      $go.disabled = true; $cancel.hidden = false; $out.textContent = '…';
      try {
        const res = await fetch('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
          signal: AbortSignal.any([ctl.signal, AbortSignal.timeout(65000)])
        });
        const data = await res.json();
        $out.textContent = res.ok ? (data.reply || '(빈 응답)') : ('오류 ' + res.status + ': ' + (data.error || ''));
      } catch (err) {
        $out.textContent = (err.name === 'TimeoutError' || err.name === 'AbortError')
          ? '취소됐거나 시간이 초과됐다.' : ('요청 실패: ' + err.message);
      } finally { $go.disabled = false; $cancel.hidden = true; ctl = null; }
    });
    $cancel.addEventListener('click', () => { if (ctl) ctl.abort(); });
    load();
  </script>
</body>
</html>
